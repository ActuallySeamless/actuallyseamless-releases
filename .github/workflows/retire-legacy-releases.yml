name: Retire legacy installer downloads

on:
  workflow_dispatch:
    inputs:
      confirm_retirement:
        description: Hide the five listed legacy releases as recoverable drafts
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: retire-legacy-installer-downloads
  cancel-in-progress: false

jobs:
  retire:
    if: inputs.confirm_retirement == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify replacement and hide only legacy downloads
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.request

          # No checkout, third-party actions, external services or persistent token.
          repo = "ActuallySeamless/actuallyseamless-releases"
          base = "https://api.github.com/repos/" + repo
          token = os.environ["GITHUB_TOKEN"]
          legacy = {"v1.5.7", "v1.6.0", "v1.6.1", "v1.6.2", "v1.6.3"}

          def api(route, method="GET", body=None):
              request = urllib.request.Request(
                  base + route,
                  data=None if body is None else json.dumps(body).encode(),
                  method=method,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          latest = api("/releases/latest")
          assert latest["tag_name"] == "v1.6.5", "Replacement is not the current latest release"
          assert not latest["draft"] and not latest["prerelease"]
          required = {"ActuallySeamless-Setup-1.6.5.exe",
                      "ActuallySeamless-Setup-1.6.5.exe.blockmap", "latest.yml"}
          assert required <= {a["name"] for a in latest["assets"]}, "Replacement assets missing"
          releases = api("/releases?per_page=100")
          matches = {r["tag_name"]: r for r in releases if r["tag_name"] in legacy}
          assert set(matches) == legacy, "A legacy release is missing; no changes started"
          assert all(not r.get("immutable", False) for r in matches.values()), "Immutable release found"

          for tag in sorted(legacy):
              release = matches[tag]
              asset_ids = {a["id"] for a in release["assets"]}
              result = release if release["draft"] else api(
                  "/releases/" + str(release["id"]), "PATCH", {"draft": True})
              assert result["draft"] and result["tag_name"] == tag
              assert asset_ids == {a["id"] for a in result["assets"]}, "Asset preservation check failed"
              print(tag + ": draft; installer assets retained")

          assert api("/releases/latest")["tag_name"] == "v1.6.5"
          print("Latest v1.6.5 remains public. No release or installer was deleted.")
